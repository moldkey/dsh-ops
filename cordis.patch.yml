# DSH 運維工作台
#
# 本包提供：
#   工具（7 個）：
#     ops_status       所有站点状态摘要
#     ops_check        跑全部检查器
#     ops_issues       未解决的问题
#     ops_snapshot     打快照
#     ops_deploy       部署（含影响分析 + 自动回滚）
#     ops_rollback     回滚到快照
#     ops_restart      重启服务
#
#   技能（1 個）：
#     ops-guide        运维工作台使用指南（何时用哪个工具、危险操作注意什么）
#
# 依赖：
#   工作台后端 https://deepseekbase.com/work/api/
#   认证复用 dshio API key（在 https://dshio.org/me/ 生成）
#
# 本包不写本地文件、不执行本地命令；
# 所有动作通过 HTTPS 调工作台 API 执行。
- insert:
    - id: dsh-ops
      name: "@liangjiehappy/dsh-ops"
